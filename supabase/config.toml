project_id = "cruxe"

# RevenueCat is not a logged-in user, so this endpoint must accept
# unauthenticated requests. Its authentication is the shared secret in the
# Authorization header, compared in constant time inside the function.
[functions.revenuecat-webhook]
verify_jwt = false

# The rest require a real user session.
[functions.submit-solve]
verify_jwt = true

[functions.sync-purchases]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
