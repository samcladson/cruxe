name: Generate Daily Puzzles

# Runs at 00:05 UTC every day to generate puzzles with a 3-day buffer.
# Generates for today, tomorrow, and day-after-tomorrow (UTC) to cover all timezones.
# Also available as a manual trigger via workflow_dispatch for specific dates.
# Runs the script directly in Node.js — no Edge Functions, no timeouts.
#
# NOTE: Currently running the `-free` variant to stay within Gemini 2.5 Flash Free Tier limits (20 RPD).
# To upgrade to the full 101-puzzle daily suite, swap `generate-daily-puzzles-free.ts` with `generate-daily-puzzles.ts`.
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD). Defaults to today UTC."
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate puzzles (3-day buffer for timezone coverage)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Generate puzzles for today, tomorrow, and day-after-tomorrow (UTC).
          # This creates a rolling buffer that ensures every timezone (up to UTC+14)
          # always has puzzles for their local date.
          # The script is idempotent — existing dates are skipped (0 Gemini API calls).
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "Manual run for specific date: ${{ github.event.inputs.date }}"
            npx tsx scripts/generate-daily-puzzles-free.ts "${{ github.event.inputs.date }}"
          else
            # FOR FREE TIER: Only generate exactly 1 day (Today/OFFSET 0), 
            # to prevent hitting the 20 RPD limit.
            #
            # 🔔 UPGRADE INSTRUCTIONS (When moving to Paid Gemini Tier):
            # 1. Change `for OFFSET in 0; do` to `for OFFSET in 0 1 2; do`
            # 2. Change `generate-daily-puzzles-free.ts` below to `generate-daily-puzzles.ts`
            # 
            # This will instantly restore the 3-day buffer of 101 puzzles per day!
            for OFFSET in 0; do
              DATE=$(date -u -d "+${OFFSET} days" +%Y-%m-%d)
              echo ""
              echo "━━━ Generating for ${DATE} (UTC+${OFFSET}d) ━━━"
              npx tsx scripts/generate-daily-puzzles-free.ts "${DATE}"
            done
          fi
