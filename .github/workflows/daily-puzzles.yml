name: Generate Daily Puzzles

# Runs at 00:05 UTC every day to generate puzzles with a 3-day buffer.
# Generates for today, tomorrow, and day-after-tomorrow (UTC) to cover all timezones.
# Also available as a manual trigger via workflow_dispatch for specific dates.
# Runs the script directly in Node.js — no Edge Functions, no timeouts.
#
# NOTE: Runs the `-free` variant, which is the only current generator — it alone
# carries the topic/lesson system (subject briefs, per-word facts, takeaways).
# `generate-daily-puzzles.ts` predates all of that and must NOT be swapped in.
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD). Defaults to today UTC."
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    # Three dates at ~19s per puzzle is ~18 minutes when every slot is empty,
    # which is only the first run and any run after a long gap. Steady state
    # is one date and a few minutes. The headroom is for the retry path.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate puzzles (3-day buffer for timezone coverage)
        id: generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Google Search grounding. Unset means off, which is correct on a
          # free-tier project: the search quota there is zero, so a grounded
          # call 429s immediately. Set the repo variable to 1 once billing is
          # enabled — see scripts/lib/groundingPolicy.ts.
          GEMINI_GROUNDING: ${{ vars.GEMINI_GROUNDING }}
        run: |
          # Generate puzzles for today, tomorrow and day-after-tomorrow (UTC).
          #
          # Why three dates and not one. A player's day rolls over at their
          # local midnight, not at 00:05 UTC, so anyone east of UTC reaches a
          # date this job has not generated yet — 5.5 hours of it in IST, up
          # to 14+ hours at UTC+14. During that window they fall back to
          # yesterday's set. Generating ahead closes that hole.
          #
          # The second reason matters more. The script is idempotent per
          # SLOT, not per date: it reads what already exists and generates
          # only the gaps. With a three-day window every date is attempted on
          # three consecutive nights, so a run that dies partway is repaired
          # the next night instead of staying broken for good. Before this,
          # 45% of days were complete and one (2026-09-19) was missing
          # entirely, because a failed run had no second chance.
          #
          # Cost: 57 calls only when all three dates are empty (first run, or
          # after a gap); 19 in steady state, since the two nearer dates are
          # already full. The free tier allows 500/day.
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "Manual run for specific date: ${{ github.event.inputs.date }}"
            npx tsx scripts/generate-daily-puzzles-free.ts "${{ github.event.inputs.date }}"
          else
            # Each date's status is captured rather than relied on implicitly:
            # without this the step would report only the LAST date's exit
            # code, so a failure on today or tomorrow would be masked by the
            # day-after-tomorrow succeeding — the opposite of the loud failure
            # this job is supposed to produce.
            FAILED=""
            for OFFSET in 0 1 2; do
              DATE=$(date -u -d "+${OFFSET} days" +%Y-%m-%d)
              echo ""
              echo "━━━ Generating for ${DATE} (UTC+${OFFSET}d) ━━━"
              if ! npx tsx scripts/generate-daily-puzzles-free.ts "${DATE}"; then
                echo "::warning title=Incomplete generation::${DATE} did not fully generate."
                FAILED="${FAILED} ${DATE}"
              fi
            done

            if [ -n "${FAILED}" ]; then
              echo "::error title=Generation failed::Dates that did not fully generate:${FAILED}. Tomorrow's run retries them, but check the log for the cause."
              exit 1
            fi
          fi

      # The generator now exits non-zero when fewer than 70% of puzzles are
      # produced, so a mostly-failed run turns the Action red. This step is the
      # backstop: it asks the database directly, so a bug in the generator's
      # own accounting cannot hide an empty day.
      #
      # Runs even when generation failed, because "how bad is it" is exactly
      # what you want to know when it did.
      - name: Verify today's puzzles exist
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)

          # PostgREST returns the row count in the Content-Range header as
          # "0-0/<total>" when asked with Prefer: count=exact.
          RANGE=$(curl -sS -o /dev/null -D - \
            "${SUPABASE_URL}/rest/v1/daily_puzzles?puzzle_date=eq.${DATE}&select=id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            | tr -d '\r' | awk -F'/' '/[Cc]ontent-[Rr]ange/ {print $2}')

          COUNT=${RANGE:-0}
          echo "Puzzles in database for ${DATE}: ${COUNT}"

          if [ "${COUNT}" -lt 5 ]; then
            echo "::error title=No puzzles for today::Only ${COUNT} puzzles exist for ${DATE}. Players will silently be served an older day's set. Check the generate step for Gemini quota (500/day) or API key problems."
            exit 1
          fi

          echo "::notice title=Puzzles ready::${COUNT} puzzles available for ${DATE}."
