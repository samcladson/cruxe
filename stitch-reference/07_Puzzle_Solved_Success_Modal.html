<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Puzzle Solved Success Modal</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#eecd2b",
                        "background-light": "#f8f8f6",
                        "background-dark": "#1a1810", // Obsidian dark
                        "surface-dark": "#221f11", // Slightly lighter obsidian for cards
                        "surface-border": "#484223", // Muted gold border
                        "text-main": "#f8f8f6",
                        "text-muted": "#c9c092", // Muted gold/beige
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Subtle particle effect simulation */
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 16px;
            background: #eecd2b;
            top: -20px;
            opacity: 0;
            border-radius: 2px;
        }
        
        .confetti-piece:nth-child(1) { left: 10%; transform: rotate(-40deg); animation: drop 3s infinite ease-out 0s; }
        .confetti-piece:nth-child(2) { left: 30%; transform: rotate(10deg); background: #fff; animation: drop 3.2s infinite ease-out 0.5s; }
        .confetti-piece:nth-child(3) { left: 50%; transform: rotate(-20deg); animation: drop 2.8s infinite ease-out 1s; }
        .confetti-piece:nth-child(4) { left: 70%; transform: rotate(50deg); background: #fff; animation: drop 3.5s infinite ease-out 0.2s; }
        .confetti-piece:nth-child(5) { left: 90%; transform: rotate(-10deg); animation: drop 3.1s infinite ease-out 0.8s; }
        .confetti-piece:nth-child(6) { left: 20%; transform: rotate(25deg); background: #c9c092; animation: drop 4s infinite ease-out 1.2s; }
        .confetti-piece:nth-child(7) { left: 60%; transform: rotate(-5deg); animation: drop 3.3s infinite ease-out 1.5s; }
        .confetti-piece:nth-child(8) { left: 80%; transform: rotate(15deg); background: #fff; animation: drop 3.7s infinite ease-out 0.9s; }

        @keyframes drop {
            0% { top: -20px; opacity: 1; transform: rotate(0deg); }
            100% { top: 100%; opacity: 0; transform: rotate(360deg); }
        }

        /* Pulse animation for the checkmark ring */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(238, 206, 43, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(238, 206, 43, 0); }
            100% { box-shadow: 0 0 0 0 rgba(238, 206, 43, 0); }
        }
        .animate-pulse-gold {
            animation: pulse-gold 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-text-main h-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- Background Confetti Layer -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<!-- Deep radial gradient to simulate "Obsidian" depth -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-dark/40 via-background-dark to-background-dark"></div>
</div>
<!-- Main Modal Content -->
<main class="relative z-10 w-full max-w-md px-6 flex flex-col h-full max-h-[850px] justify-between py-8">
<!-- Header Section -->
<div class="flex flex-col items-center justify-center pt-8 animate-fade-in-down">
<!-- Animated Success Icon -->
<div class="mb-6 rounded-full bg-surface-dark border-2 border-primary/20 p-1 animate-pulse-gold">
<div class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-yellow-600 flex items-center justify-center text-background-dark shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-4xl font-bold">check</span>
</div>
</div>
<h1 class="text-4xl md:text-5xl font-serif font-bold text-primary text-center tracking-tight drop-shadow-sm mb-2">
                PUZZLE SOLVED!
            </h1>
<p class="text-text-muted text-sm font-medium tracking-widest uppercase">Excellent Work</p>
</div>
<!-- Scrollable Content Area (if needed on small screens) -->
<div class="flex-1 flex flex-col justify-center gap-6 py-4">
<!-- Results Stats Card -->
<div class="grid grid-cols-3 gap-2 bg-surface-dark border border-surface-border p-4 rounded-xl shadow-xl backdrop-blur-sm bg-opacity-90">
<div class="flex flex-col items-center justify-center p-2 border-r border-surface-border/50 last:border-0">
<span class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-1">Time</span>
<span class="text-2xl font-bold text-white tabular-nums tracking-tight">04:32</span>
</div>
<div class="flex flex-col items-center justify-center p-2 border-r border-surface-border/50 last:border-0">
<span class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-1">Accuracy</span>
<span class="text-2xl font-bold text-white tabular-nums tracking-tight">94%</span>
</div>
<div class="flex flex-col items-center justify-center p-2">
<span class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-1">Hints</span>
<span class="text-2xl font-bold text-white tabular-nums tracking-tight">1</span>
</div>
</div>
<!-- Score & Rewards -->
<div class="flex flex-col items-center justify-center gap-2 py-2">
<div class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-b from-primary to-yellow-600 drop-shadow-sm tabular-nums">
                    2,840
                 </div>
<div class="text-text-muted text-sm uppercase tracking-widest font-semibold">Total Points</div>
<div class="mt-2 flex items-center gap-2 bg-surface-dark/50 px-4 py-1.5 rounded-full border border-surface-border/30">
<span class="material-symbols-outlined text-primary text-lg">monetization_on</span>
<span class="text-white font-bold tracking-wide text-sm">+120 coins</span>
</div>
</div>
<!-- Streak Banner -->
<div class="relative overflow-hidden bg-gradient-to-r from-surface-dark via-[#2e2a18] to-surface-dark border border-surface-border p-3.5 rounded-lg flex items-center justify-between group cursor-pointer hover:border-primary/50 transition-colors">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="flex items-center gap-3 relative z-10">
<div class="w-10 h-10 rounded-lg bg-surface-border/30 flex items-center justify-center text-orange-500">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div>
<p class="text-white font-bold text-lg leading-tight">3 Day Streak!</p>
<p class="text-text-muted text-xs">Keep the fire burning.</p>
</div>
</div>
<div class="relative z-10">
<span class="material-symbols-outlined text-text-muted">chevron_right</span>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-3 pb-6 pt-2">
<!-- Primary Action -->
<button class="w-full h-14 bg-primary hover:bg-yellow-400 active:bg-yellow-500 text-background-dark font-extrabold text-lg tracking-wide rounded-lg flex items-center justify-center gap-2 transition-all shadow-[0_0_15px_rgba(238,205,43,0.3)] hover:shadow-[0_0_25px_rgba(238,205,43,0.5)]">
<span class="material-symbols-outlined">play_circle</span>
                PLAY NEXT
            </button>
<div class="grid grid-cols-2 gap-3">
<!-- Secondary Action -->
<button class="h-12 border border-surface-border hover:border-primary/50 bg-transparent text-white font-semibold text-sm tracking-wider uppercase rounded-lg flex items-center justify-center gap-2 transition-colors group">
<span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-lg">share</span>
                    Share Result
                </button>
<!-- Tertiary Action -->
<button class="h-12 border border-surface-border hover:border-primary/50 bg-transparent text-white font-semibold text-sm tracking-wider uppercase rounded-lg flex items-center justify-center gap-2 transition-colors group">
<span class="material-symbols-outlined text-text-muted group-hover:text-primary transition-colors text-lg">home</span>
                    Home
                </button>
</div>
</div>
</main>
</body></html>
