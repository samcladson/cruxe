<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Emerald Velvet Crossword</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#051410",
                        "background-light": "#f6f8f7",
                        "background-dark": "#061612", // Deep emerald as requested
                        "velvet-dark": "#030c0a",
                        "gold-muted": "#C5A059",
                        "gold-highlight": "#E5C585",
                        "mint-soft": "#A8E6CF",
                        "mint-glow": "rgba(168, 230, 207, 0.15)",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        'velvet-inset': 'inset 2px 2px 5px rgba(0,0,0,0.6), inset -1px -1px 2px rgba(255,255,255,0.05)',
                        'velvet-raised': '4px 4px 10px rgba(0,0,0,0.5), -1px -1px 2px rgba(255,255,255,0.05)',
                        'gold-glow': '0 0 15px rgba(197, 160, 89, 0.3)',
                        'inner-glow': 'inset 0 0 12px rgba(168, 230, 207, 0.2)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Newsreader', serif;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #061612;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f3a33;
            border-radius: 2px;
        }
        
        .velvet-texture {
            background-color: #061612;
            background-image: 
                radial-gradient(circle at 50% 0%, #132f28 0%, transparent 70%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        .key-btn {
            background: linear-gradient(145deg, #0a211b, #040e0b);
            box-shadow: 2px 2px 5px #020706, -1px -1px 2px #0e2f26;
        }
        .key-btn:active {
            box-shadow: inset 2px 2px 5px #020706, inset -1px -1px 2px #0e2f26;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex justify-center velvet-texture">
<!-- Mobile Container -->
<div class="w-full max-w-md h-screen flex flex-col relative overflow-hidden bg-transparent shadow-2xl">
<!-- Header -->
<header class="flex items-center justify-between p-4 pt-6 z-10">
<button class="text-gold-muted hover:text-white transition-colors p-2 rounded-full active:bg-white/5">
<span class="material-symbols-outlined" style="font-size: 28px;">menu</span>
</button>
<div class="flex flex-col items-center">
<span class="text-gold-muted text-xs uppercase tracking-[0.2em] font-medium opacity-80 mb-1">Daily Puzzle</span>
<h1 class="text-slate-100 text-2xl font-bold tracking-tight italic">Emerald Velvet</h1>
</div>
<button class="text-gold-muted hover:text-white transition-colors p-2 rounded-full active:bg-white/5">
<span class="material-symbols-outlined fill-current" style="font-size: 26px; font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<!-- Stats Bar -->
<div class="flex justify-between items-center px-6 py-2 mb-2">
<div class="flex flex-col items-center">
<span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Score</span>
<span class="text-gold-muted font-bold text-lg">1,250</span>
</div>
<div class="h-8 w-px bg-gradient-to-b from-transparent via-white/10 to-transparent"></div>
<div class="flex flex-col items-center">
<span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Time</span>
<span class="text-slate-200 font-bold text-lg font-mono">04:12</span>
</div>
<div class="h-8 w-px bg-gradient-to-b from-transparent via-white/10 to-transparent"></div>
<div class="flex flex-col items-center">
<span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Streak</span>
<span class="text-mint-soft font-bold text-lg">5 Days</span>
</div>
</div>
<!-- Clue Display -->
<div class="px-4 mb-4 z-10">
<div class="bg-gradient-to-b from-[#0e2520] to-[#051410] rounded-xl p-4 shadow-velvet-raised border border-white/5 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent opacity-30"></div>
<div class="flex justify-between items-start gap-4 relative z-10">
<span class="bg-gold-muted text-primary text-xs font-bold px-2 py-1 rounded shadow-sm">4 Down</span>
<button class="text-gold-muted/50 hover:text-gold-muted">
<span class="material-symbols-outlined text-sm">info</span>
</button>
</div>
<p class="text-center text-slate-100 text-xl font-medium leading-tight mt-2 italic font-display">
                    "A precious stone of rich green color" (7)
                </p>
<div class="flex justify-center gap-2 mt-4">
<div class="h-1.5 w-1.5 rounded-full bg-gold-muted"></div>
<div class="h-1.5 w-1.5 rounded-full bg-white/20"></div>
<div class="h-1.5 w-1.5 rounded-full bg-white/20"></div>
</div>
</div>
</div>

<div class="flex-1 px-4 flex items-center justify-center relative">

<div class="grid grid-cols-5 gap-1.5 p-3 bg-[#081c17] rounded-2xl shadow-[inset_0_0_20px_rgba(0,0,0,0.8),0_0_0_1px_rgba(255,255,255,0.05)] relative z-10 w-full aspect-square max-w-[360px]">
<!-- Row 1 -->
<div class="bg-[#030c0a] rounded-lg shadow-velvet-inset"></div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    E<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">1</span>
</div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    M<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">2</span>
</div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    E<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">3</span>
</div>
<div class="bg-[#030c0a] rounded-lg shadow-velvet-inset"></div>
<!-- Row 2 -->
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    S<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">4</span>
</div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    H
                </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    O
                </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    R
                </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    E<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">5</span>
</div>
<!-- Row 3 (Active Word) -->
<div class="bg-[#030c0a] rounded-lg shadow-velvet-inset"></div>
<!-- Active Cell -->
<div class="bg-[#1a3d35] rounded-lg shadow-inner-glow ring-1 ring-mint-soft/50 flex items-center justify-center text-2xl font-bold text-mint-soft relative animate-pulse">
                    R<span class="absolute top-0.5 left-1 text-[8px] text-mint-soft/70 font-normal">6</span>
</div>
<div class="bg-[#132f28] rounded-lg shadow-inner-glow flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-mint-soft/20">
                    A
                </div>
<div class="bg-[#132f28] rounded-lg shadow-inner-glow flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-mint-soft/20">
                    L
                </div>
<div class="bg-[#132f28] rounded-lg shadow-inner-glow flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-mint-soft/20">
                    D<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">7</span>
</div>
<!-- Row 4 -->
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    V<span class="absolute top-0.5 left-1 text-[8px] text-slate-400 font-normal">8</span>
</div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    E
                </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    L
                </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    V
                </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                    E
                </div>
<!-- Row 5 -->
<div class="bg-[#030c0a] rounded-lg shadow-velvet-inset"></div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                     D
                 </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                     E
                 </div>
<div class="bg-[#0e2520] rounded-lg shadow-velvet-raised flex items-center justify-center text-2xl font-bold text-slate-200 relative border border-white/5">
                     T
                 </div>
<div class="bg-[#030c0a] rounded-lg shadow-velvet-inset"></div>
</div>
</div>
<!-- Action / Hint Bar -->
<div class="px-4 py-3 flex justify-between items-center text-slate-400 text-sm font-medium">
<button class="flex items-center gap-2 hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-lg">lightbulb</span>
                Hint
            </button>
<button class="flex items-center gap-2 hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-lg">edit</span>
                Pencil Mode
            </button>
</div>
<!-- Keyboard -->
<div class="bg-[#04100d] rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.5)] border-t border-white/5 pb-6 pt-4 px-1 z-20">
<div class="flex flex-col gap-2 w-full max-w-[98%] mx-auto">
<!-- Row 1 -->
<div class="flex gap-1.5 justify-center">
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">Q</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">W</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">E</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">R</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">T</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">Y</button>

</div>
<!-- Row 2 -->
<div class="flex gap-1.5 justify-center px-4">

<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">D</button>

<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">K</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">L</button>
</div>
<!-- Row 3 -->
<div class="flex gap-1.5 justify-center px-1">
<button class="key-btn w-12 flex-none h-12 rounded-lg flex items-center justify-center text-gold-muted">
<span class="material-symbols-outlined" style="font-size: 20px;">keyboard_arrow_left</span>
</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">Z</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">X</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">C</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">V</button>
<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">B</button>

<button class="key-btn flex-1 h-12 rounded-lg flex items-center justify-center text-slate-200 font-bold text-lg">M</button>
<button class="key-btn w-12 flex-none h-12 rounded-lg flex items-center justify-center text-gold-muted">
<span class="material-symbols-outlined" style="font-size: 20px;">backspace</span>
</button>

<button class="key-btn w-full h-11 rounded-full flex items-center justify-center text-gold-muted/80 text-sm font-bold tracking-widest uppercase shadow-gold-glow border border-gold-muted/20">
